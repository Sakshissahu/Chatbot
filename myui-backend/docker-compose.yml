# Dedicated Postgres for the IB Group chat backend.
# Separate container, name, volume and host port from the existing
# chatbot_postgres (5433) — these two never collide.
# Variable values are read from ./.env (gitignored) by Compose.
services:
  ibchat-postgres:
    image: postgres:16-alpine
    container_name: ibchat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ibchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ibchat_pgdata:
