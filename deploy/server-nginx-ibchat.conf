# IB Chatbot — chickenbot (frontend + /bff backend), auditupload (BFF fallback), botadmin (RAGFlow)
# Single-port: chickenbot serves the UI AND proxies /bff to the BFF (127.0.0.1:7071).
# Deploy: WinSCP this to the server (~/), then:
#   sudo cp ~/server-nginx-ibchat.conf /etc/nginx/sites-enabled/ibchat && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name chickenbot.abisexport.com auditupload.abisexport.com botadmin.abisexport.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chickenbot.abisexport.com;

    ssl_certificate /etc/nginx/ssl/abisexport/abisexport.pem;
    ssl_certificate_key /etc/nginx/ssl/abisexport/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/pragyesh/IB_Chatbot/myui/dist;
    index index.html;

    # Backend (BFF) on the SAME origin — this is what makes it single-port.
    # Same SSE-safe settings as the auditupload block so chat streaming works.
    location /bff/ {
        proxy_pass http://127.0.0.1:7071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 25M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Kept as a fallback so the old build still works during/after the switch.
server {
    listen 443 ssl;
    server_name auditupload.abisexport.com;

    ssl_certificate /etc/nginx/ssl/abisexport/abisexport.pem;
    ssl_certificate_key /etc/nginx/ssl/abisexport/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }
}

server {
    listen 443 ssl;
    server_name botadmin.abisexport.com;

    ssl_certificate /etc/nginx/ssl/abisexport/abisexport.pem;
    ssl_certificate_key /etc/nginx/ssl/abisexport/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7072;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
